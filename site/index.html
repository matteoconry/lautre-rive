<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1220">
  <meta name="description" content="L'Autre Rive : six jours dans la vie de quelqu'un qui ne vote pas comme toi.">
  <title>L'Autre Rive · prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="jeu" class="jeu">
    <!-- Bandeau du haut : compte à rebours et jauges -->
    <header id="hud" class="hud cache" aria-label="État du personnage">
      <div class="compte" aria-live="polite">
        <span id="compte-jour" class="compte-jour">J-6</span>
        <span id="compte-texte" class="compte-texte">avant le vote</span>
        <span id="compte-pips" class="compte-pips" aria-hidden="true"></span>
      </div>
      <div class="jauges">
        <div class="jauge" id="jauge-fin_de_mois">
          <span class="jauge-nom">Fin de mois</span>
          <span class="jauge-valeur"><span class="nombre">212</span> €</span>
          <span class="jauge-delta" aria-hidden="true"></span>
        </div>
        <div class="jauge" id="jauge-energie">
          <span class="jauge-nom">Énergie</span>
          <span class="jauge-barre" aria-hidden="true"></span>
          <span class="jauge-delta" aria-hidden="true"></span>
        </div>
        <div class="jauge" id="jauge-liens">
          <span class="jauge-nom">Liens</span>
          <span class="jauge-barre" aria-hidden="true"></span>
          <span class="jauge-delta" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <!-- La scène en pixel art -->
    <div class="ecran">
      <canvas id="scene" width="160" height="90" aria-hidden="true"></canvas>
      <div id="titre-scene" class="titre-scene" aria-live="polite"></div>
      <button id="son" class="son" type="button" aria-pressed="false" title="Couper le son">♪ Son</button>
    </div>

    <!-- Le texte et les choix -->
    <section id="boite" class="boite" aria-live="polite">
      <div id="texte" class="texte"></div>
      <div id="choix" class="choix"></div>
      <button id="suite" class="suite cache" type="button" aria-label="Continuer">▼</button>
    </section>
  </main>

  <script src="js/dessins.js"></script>
  <script src="js/musique.js"></script>
  <script src="js/histoire-sebastien.js"></script>
  <script src="js/histoire-lea.js"></script>
  <script src="js/rencontre.js"></script>
  <script src="js/generique.js"></script>
  <script src="js/moteur.js"></script>
</body>
</html>
